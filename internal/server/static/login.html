<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Welcome back · degitide</title>
    <link rel="icon" href="/brand.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/auth.css" />
    <script src="/auth.js" defer></script>
  </head>
  <body data-page="login" data-error="__DEGITIDE_ERROR_CODE__">
    <header class="auth-header">
      <a class="brand" href="/" aria-label="Degitide home"
        ><img src="/brand.svg" alt="" />degitide</a
      >
      <span class="auth-caption">Portfolio workspace</span>
    </header>
    <main class="auth-shell">
      <section class="auth-form" aria-labelledby="auth-title">
        <p class="eyebrow auth-kicker">01 / Workspace access</p>
        <h1 id="auth-title">Welcome back</h1>
        <p class="auth-copy">Sign in to your Degitide workspace.</p>
        <form action="/login" method="post">
          <input
            name="csrf_token"
            type="hidden"
            value="__DEGITIDE_CSRF_TOKEN__"
          />
          <div class="field">
            <label for="username">Username</label
            ><input
              class="input"
              id="username"
              name="username"
              type="text"
              value="__DEGITIDE_USERNAME__"
              minlength="3"
              maxlength="64"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              required
              autofocus
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input
                class="input"
                id="password"
                name="password"
                type="password"
                maxlength="256"
                autocomplete="current-password"
                required
              /><button
                class="reveal"
                type="button"
                data-reveal="password"
                aria-label="Show password"
              >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>
          <p class="error" id="error" role="alert"></p>
          <button class="button primary submit" type="submit">
            Sign in <span aria-hidden="true">→</span>
          </button>
        </form>
      </section>
      <p class="auth-foot">
        Your Degitide login is separate from your DEGIRO accounts.
      </p>
    </main>
  </body>
</html>
