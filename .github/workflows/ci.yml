name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_sure_e2e:
        description: Skip Sure end-to-end tests for this manual run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [[ -n "$unformatted" ]]; then
            printf 'gofmt is required for:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            worker/requirements.txt
            proxy/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r worker/requirements.txt -r proxy/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q worker proxy docker docker-bootstrap.py scripts

      - name: Test worker
        working-directory: worker
        run: python -m unittest discover -s tests -v

      - name: Test egress policy
        run: python -m unittest discover -s proxy/tests -v

      - name: Test fund-return updater
        run: python -m unittest discover -s scripts/tests -v

      - name: Install Chromium for browser regressions
        run: python -m patchright install --with-deps chromium

      - name: Test calculated valuation and dashboard in Chromium
        run: |
          python tests/browser/valuation_sync.py
          python tests/browser/portfolio_valuation.py
          python tests/browser/schedule_settings.py
          python tests/browser/sync_progress.py
          python tests/browser/degiro_onboarding.py
          python tests/browser/changelog.py
          python tests/browser/sure_onboarding.py

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check shell syntax
        run: sh -n docker-entrypoint.sh proxy/entrypoint.sh scripts/native-login.sh

      - name: Validate normal Compose configuration
        run: docker compose config --quiet

      - name: Validate native-login Compose configuration
        run: >-
          docker compose
          -f docker-compose.split.yml
          -f docker-compose.login.yml
          --profile native-login
          config --quiet

  sure-integration:
    name: Sure integration (real Docker services)
    if: github.event_name != 'workflow_dispatch' || !inputs.skip_sure_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        layout: [split, all-in-one]
        include:
          - layout: split
            target: app-runtime
            image: degitide-sure-e2e-app
          - layout: all-in-one
            target: all-in-one-runtime
            image: degitide-all-in-one:local
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build integration image with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=ci-sure-${{ matrix.layout }}
          cache-to: type=gha,mode=max,scope=ci-sure-${{ matrix.layout }}

      - name: Start Sure services
        run: |
          if [ "${{ matrix.layout }}" = all-in-one ]; then
            docker compose -f tests/integration/sure/compose.yml -f tests/integration/sure/compat.yml -f tests/integration/sure/all-in-one.yml -p degitide-sure-aio up -d --no-build --wait --wait-timeout 180
          else
            docker compose -f tests/integration/sure/compose.yml -f tests/integration/sure/compat.yml -p degitide-sure-e2e up -d --no-build --wait --wait-timeout 180
          fi

      - name: Exercise Sure import and restart recovery
        run: python3 tests/integration/sure/run.py ${{ matrix.layout == 'all-in-one' && '--all-in-one' || '' }}

      - name: Show service status on failure
        if: failure()
        run: docker ps -a

      - name: Remove synthetic services and volumes
        if: always()
        run: |
          make test-sure-down
          docker compose -f tests/integration/sure/compose.yml -f tests/integration/sure/compat.yml -f tests/integration/sure/all-in-one.yml -p degitide-sure-aio down --volumes --remove-orphans

  all-in-one:
    name: All-in-one browser and restart flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build integration image with cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: all-in-one-runtime
          platforms: linux/amd64
          load: true
          tags: degitide-all-in-one:local
          cache-from: type=gha,scope=ci-browser
          cache-to: type=gha,mode=max,scope=ci-browser
      - run: python3 tests/integration/all-in-one/run.py --no-build
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file /dev/null -p degitide-aio-e2e -f docker-compose.yml -f tests/integration/all-in-one/compose.yml logs --tail=100
      - name: Cleanup
        if: always()
        run: docker compose --env-file /dev/null -p degitide-aio-e2e -f docker-compose.yml -f tests/integration/all-in-one/compose.yml down --volumes

  dashboard:
    name: Dashboard calculations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"

      - name: Check dashboard scripts
        run: |
          node --check internal/server/static/dashboard.js
          node --check internal/server/static/auth.js
          node --check internal/server/static/portfolio.js
          node --test scripts/tests/portfolio.test.cjs
